<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00897b">
    <title>DrWEEE - Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00897b 0%, #26a69a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .container { text-align: center; max-width: 400px; }
        .logo-icon { font-size: 80px; margin-bottom: 24px; }
        .title { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        .text { font-size: 16px; opacity: 0.9; line-height: 1.5; margin-bottom: 32px; }
        .btn {
            background: white;
            color: #00897b;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">♻</div>
        <h1 class="title">
            <span data-lang="ar">انت غير متصل</span>
            <span data-lang="en" style="display:none">You're Offline</span>
        </h1>
        <p class="text">
            <span data-lang="ar">تحقق من اتصالك بالإنترنت وحاول مرة أخرى</span>
            <span data-lang="en" style="display:none">Check your internet connection and try again</span>
        </p>
        <button class="btn" onclick="location.reload()">
            <span data-lang="ar">إعادة المحاولة</span>
            <span data-lang="en" style="display:none">Try Again</span>
        </button>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
        const lang = localStorage.getItem('drweee_lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-lang]').forEach(el => {
            el.style.display = el.dataset.lang === lang ? '' : 'none';
        });
    </script>
</body>
</html>
