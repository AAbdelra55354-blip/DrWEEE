<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00897b">
    <title>DrWEEE - Offline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00897b 0%, #26a69a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .offline-container {
            text-align: center;
            max-width: 400px;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .offline-icon svg {
            width: 60px;
            height: 60px;
        }

        .offline-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .offline-text {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .retry-btn {
            background: white;
            color: #00897b;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .retry-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .retry-btn:hover .retry-icon {
            transform: rotate(180deg);
        }

        .logo {
            margin-top: 48px;
            opacity: 0.8;
            font-size: 20px;
            font-weight: 700;
        }

        .logo-accent {
            color: #b2dfdb;
        }

        /* Language toggle */
        .lang-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        [data-lang="en"] { display: none; }
        body.en [data-lang="ar"] { display: none; }
        body.en [data-lang="en"] { display: inline; }
        body.en { direction: ltr; }
    </style>
</head>
<body>
    <button class="lang-toggle" onclick="toggleLang()">EN / ع</button>

    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1 class="offline-title">
            <span data-lang="ar">انت غير متصل بالإنترنت</span>
            <span data-lang="en">You're Offline</span>
        </h1>

        <p class="offline-text">
            <span data-lang="ar">تحقق من اتصالك بالإنترنت وحاول مرة أخرى. سيتم تحميل التطبيق تلقائياً عند استعادة الاتصال.</span>
            <span data-lang="en">Check your internet connection and try again. The app will load automatically when connection is restored.</span>
        </p>

        <button class="retry-btn" onclick="retryConnection()">
            <svg class="retry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span data-lang="ar">إعادة المحاولة</span>
            <span data-lang="en">Try Again</span>
        </button>

        <div class="logo">
            Dr.<span class="logo-accent">WEEE</span>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });

        function retryConnection() {
            // Add rotation animation to button
            document.querySelector('.retry-icon').style.animation = 'spin 0.5s ease';
            setTimeout(() => {
                window.location.reload();
            }, 500);
        }

        function toggleLang() {
            document.body.classList.toggle('en');
            localStorage.setItem('drweee_lang', document.body.classList.contains('en') ? 'en' : 'ar');
        }

        // Check saved language preference
        if (localStorage.getItem('drweee_lang') === 'en') {
            document.body.classList.add('en');
        }

        // Add spin animation
        const style = document.createElement('style');
        style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
